apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  namespace: devops-ucu
  labels:
    app.kubernetes.io/name: {{ include "backend.name" . }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
data:
  APP_NAME: {{ .Values.appConfig.APP_NAME | quote }}
  APP_VERSION: {{ .Values.appConfig.APP_VERSION | quote }}
